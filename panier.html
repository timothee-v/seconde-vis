<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votre panier | Seconde Vis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="panier">
  <div id="site-header"></div>

  <main class="page-panier">
    <div class="conteneur">
      <h1 class="titre-geant">Votre Panier</h1>
      <div id="liste-panier"></div>

      <section id="recap" class="recap" hidden>
        <div class="total"><span>TOTAL</span><span id="total"></span></div>
        <p class="economie">Vous économisez <strong id="economie"></strong> par rapport au prix neuf.</p>

        <form id="form-resa" class="resa">
          <div class="resa-info">
            <h3>Retrait à l'entrepôt</h3>
            <p id="adresse"></p>
            <p class="petit">Paiement sur place au moment du retrait. Votre réservation est gardée 48 h.</p>
          </div>
          <div class="resa-champs">
            <input name="nom" required placeholder="Nom complet" autocomplete="name">
            <input name="courriel" type="email" required placeholder="Adresse courriel" autocomplete="email">
            <input name="tel" type="tel" placeholder="Téléphone (facultatif)" autocomplete="tel">
            <select name="creneau" id="creneau" required></select>
          </div>
          <label class="cgv"><input type="checkbox" id="cgv"> J'accepte les conditions générales de réservation</label>
          <button class="btn-blanc gros" id="btn-resa" type="submit" disabled>RÉSERVER MA COMMANDE</button>
        </form>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
